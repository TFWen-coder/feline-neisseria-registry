<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>貓 Neisseria 心包炎病例登錄</title>
<meta name="description" content="台灣貓 Neisseria 屬細菌性心包炎多中心回溯性病例系列：線上病例登錄">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='11' width='26' height='10' rx='5' fill='%235A3EA6' transform='rotate(-24 16 16)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=Source+Serif+4:ital,wght@1,600&display=swap">
<style>
/* 版面：左側步驟列＋右側一次一步的表單；手機改成上方六段進度條，底部固定「上一步／下一步」 */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{
  --slide:#F5F6FA;--surface:#FFFFFF;--ink:#221B35;--ink-2:#5E5873;
  --line:#DAD7E6;--line-strong:#B6B0CC;
  --violet:#5A3EA6;--violet-tint:#EEEAF8;--on-violet:#FFFFFF;
  --safranin:#C42F63;--safranin-tint:#FBE8EF;
  --ok:#2E7A57;--warn:#8A5200;--warn-tint:#FFF1D6;
  --cell:#E8E1F5;--cell-edge:#CDBFEA;--nuc:#6B4DB3;--nuc-2:#9A84D6;--vac:#FFFFFF;--bact:#2E1F63;
  --font-body:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-display:"Noto Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU",serif;
  --gutter:24px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --slide:#14111D;--surface:#1C1828;--ink:#EDEAF6;--ink-2:#ABA5C0;
    --line:#332D45;--line-strong:#4D4566;
    --violet:#A994F2;--violet-tint:#2A2342;--on-violet:#15111F;
    --safranin:#F2709B;--safranin-tint:#3A1C29;
    --ok:#5DC593;--warn:#F0B65A;--warn-tint:#33260F;
    --cell:#2A2341;--cell-edge:#41376A;--nuc:#9D86EA;--nuc-2:#C9BBF5;--vac:#15111F;--bact:#EDE6FF;
    color-scheme:dark;
  }
}
@media (max-width:600px){:root{--gutter:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--slide);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.7}
a{color:var(--violet);text-underline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.skip{position:absolute;left:-9999px;top:12px}
.skip:focus{left:16px;z-index:20;background:var(--surface);padding:8px 12px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}

/* 提示列 */
.banner{margin-top:16px;padding:12px 16px;border-radius:10px;font-size:14.5px;line-height:1.6;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.banner.demo{background:var(--warn-tint);color:var(--warn)}
.banner.draft{background:var(--violet-tint)}
.banner-text{flex:1 1 260px}
.banner-btn{font:inherit;font-size:14px;padding:6px 14px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer}

/* 開頭 */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 48px;padding-block:44px 4px;align-items:start}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,4.4vw,44px);line-height:1.25;margin:0 0 14px;letter-spacing:.02em;text-wrap:balance}
.genus{font-family:"Source Serif 4",var(--font-display);font-style:italic;font-weight:600;letter-spacing:0}
.lede{max-width:35em;font-size:16.5px;margin:0}
.hero-fig{margin:0;width:clamp(88px,15vw,156px)}
.hero-fig svg{display:block;width:100%;height:auto}
.facts{grid-column:1/-1;display:grid;grid-template-columns:1.5fr 1.1fr .8fr 1.2fr;margin:24px 0 0;border-top:1px solid var(--line)}
.facts>div{padding:14px 22px 0 0;min-width:0}
.facts dt{font-size:13px;color:var(--ink-2);margin:0 0 2px}
.facts dd{margin:0;font-size:14.5px;line-height:1.65}

/* 主體 */
.app{display:grid;grid-template-columns:196px minmax(0,1fr);gap:48px;align-items:start;padding-block:36px 56px;scroll-margin-top:8px}
.app:focus{outline:none}
.steps{position:sticky;top:24px}
.steps ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.step-btn{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:transparent;color:var(--ink-2);font:inherit;font-size:15px;line-height:1.4;text-align:left;cursor:pointer}
.step-btn:hover{background:var(--violet-tint);color:var(--ink)}
.step-btn[aria-current="step"]{background:var(--violet-tint);color:var(--ink);font-weight:500}
.step-btn .n{font-variant-numeric:tabular-nums;width:1em;text-align:right}
.rod{flex:none;width:16px;height:7px;border-radius:4px;border:1.5px solid var(--line-strong);transform:rotate(-24deg);transition:background-color .3s,border-color .3s}
.rod[data-state="done"]{background:var(--violet);border-color:var(--violet)}
.rod[data-state="error"]{border-color:var(--safranin);background:var(--safranin-tint)}
.steps-meta{font-size:13px;color:var(--ink-2);margin:16px 10px 0;font-variant-numeric:tabular-nums}
.panel{min-width:0}
.step-head{margin-bottom:26px}
.step-count{font-size:13.5px;color:var(--ink-2);margin:0 0 4px;font-variant-numeric:tabular-nums}
.step-head h2{font-family:var(--font-display);font-size:26px;line-height:1.35;margin:0;font-weight:700}
.step-desc{margin:8px 0 0;color:var(--ink-2);font-size:15px;max-width:38em}
.whoami{margin:12px 0 0;font-size:14.5px;color:var(--ink-2)}
.linkbtn{font:inherit;color:var(--violet);background:none;border:0;padding:0 2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* 欄位 */
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:24px 20px}
.field{grid-column:span var(--span,6);min-width:0}
.lab,legend{display:block;font-weight:500;font-size:15px;margin:0 0 7px;padding:0;line-height:1.5}
fieldset{border:0;margin:0;padding:0;min-width:0}
.req{color:var(--safranin);margin-left:3px}
.help{font-size:13px;color:var(--ink-2);margin:6px 0 0;line-height:1.6}
.err{font-size:13px;color:var(--safranin);margin:6px 0 0;line-height:1.5}
.err:empty{display:none}
.input{width:100%;font:inherit;font-size:16px;line-height:1.4;padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.input::placeholder{color:var(--ink-2);opacity:.7}
.input:focus-visible{outline:2px solid var(--violet);outline-offset:0;border-color:var(--violet)}
.input.upper{text-transform:uppercase;letter-spacing:.06em}
.field.invalid .input{border-color:var(--safranin)}
select.input{appearance:none;-webkit-appearance:none;padding-right:36px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 19px) 52%,calc(100% - 14px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
textarea.input{resize:vertical;line-height:1.65}
.unit-wrap{display:flex}
.unit-wrap .input{border-radius:8px 0 0 8px;min-width:0}
.unit{display:flex;align-items:center;padding:0 10px;border:1px solid var(--line-strong);border-left:0;border-radius:0 8px 8px 0;background:var(--violet-tint);color:var(--ink-2);font-size:13.5px;white-space:nowrap}
.code-status{font-size:13px;margin:6px 0 0;color:var(--ink-2)}
.code-status:empty{display:none}
.code-status.ok{color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex;min-width:0;max-width:100%}
.chip input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);font-size:15px;line-height:1.45}
.chip:hover span{border-color:var(--violet)}
.chip input:checked+span{background:var(--violet);border-color:var(--violet);color:var(--on-violet)}
.chip input[type=checkbox]:checked+span::before{content:"✓";font-size:12.5px}
.chip input:focus-visible+span{outline:2px solid var(--violet);outline-offset:2px}
.field.invalid .chip span{border-color:var(--safranin)}
.other{margin-top:10px}
.consent{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;line-height:1.6}
.consent input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--violet);flex:none}
.field.invalid .consent{border-color:var(--safranin)}
.file-row{position:relative;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:14px;border:1px dashed var(--line-strong);border-radius:10px;background:var(--surface)}
.field.drag .file-row{border-color:var(--violet);background:var(--violet-tint)}
.field.invalid .file-row{border-color:var(--safranin)}
.sr-file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.btn-file{display:inline-block;padding:7px 14px;border-radius:8px;border:1px solid var(--violet);color:var(--violet);font-size:15px;font-weight:500;cursor:pointer;line-height:1.4}
.sr-file:focus-visible+.btn-file{outline:2px solid var(--violet);outline-offset:2px}
.file-hint{font-size:13.5px;color:var(--ink-2)}
.drug-list{display:grid;gap:10px}
.drug-row{border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;background:var(--surface)}
.drug-name{font-weight:500;font-size:14.5px;margin:0 0 8px}
.drug-cells{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px 10px}
.drug-cells.named{grid-template-columns:repeat(6,minmax(0,1fr))}
.drug-cell{display:block;min-width:0}
.drug-k{display:block;font-size:12.5px;color:var(--ink-2);margin:0 0 3px}
.drug-cell .input{padding:8px 9px;font-size:15px}
.drug-empty{font-size:14px;color:var(--ink-2);margin:0}
@media (max-width:760px){.drug-cells,.drug-cells.named{grid-template-columns:repeat(2,minmax(0,1fr))}}
.file-list{list-style:none;margin:6px 0 0;padding:0}
.file-list:empty{display:none}
.file-list li{display:flex;align-items:center;gap:10px;padding:4px 2px;font-size:14.5px;border-bottom:1px solid var(--line)}
.fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsize{color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:13px}
.row-del{flex:none;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--ink-2);font-size:20px;line-height:1;cursor:pointer}
.row-del:hover{background:var(--safranin-tint);color:var(--safranin)}

/* 送出前檢查 */
.review{margin-top:36px;padding:20px 22px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.review h3{font-size:16px;margin:0 0 6px}
.review p{margin:0}
.review-list{margin:6px 0 12px;padding-left:1.2em;font-size:14.5px;line-height:1.8}
.review-list:last-child{margin-bottom:0}
.review-list.miss a{color:var(--safranin)}
.review-ok{color:var(--ok);margin-bottom:10px!important}
.submit-msg{margin-top:14px;font-size:14.5px}
.submit-msg.bad{color:var(--safranin)}
.preview{max-height:320px;overflow:auto;font-size:12.5px;line-height:1.5;background:var(--slide);border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0 0;white-space:pre-wrap;word-break:break-all}

/* 上一步／下一步 */
.pager{position:sticky;bottom:0;z-index:4;display:flex;align-items:center;gap:12px;margin-top:36px;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));background:var(--slide);border-top:1px solid var(--line)}
.pager-status{flex:1;min-width:0;font-size:13px;color:var(--ink-2);line-height:1.5}
.btn-primary{font:inherit;font-weight:500;font-size:16px;padding:11px 26px;border-radius:10px;border:0;background:var(--violet);color:var(--on-violet);cursor:pointer;white-space:nowrap}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary[disabled]{opacity:.55;cursor:progress}
.btn-secondary{font:inherit;font-size:15px;padding:10px 18px;border-radius:10px;border:1px solid var(--line-strong);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.btn-secondary:hover{border-color:var(--violet)}

/* 完成 */
.done-title{font-family:var(--font-display);font-size:26px;margin:0}
.case-id{font-size:clamp(30px,5vw,42px);font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--violet);margin:6px 0 14px;line-height:1.2}
.done h3{font-size:16px;margin:28px 0 8px}
.done p{max-width:38em}
.up-list{list-style:none;margin:0;padding:0;font-size:14.5px}
.up-list li{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.up-list .mark{flex:none;font-size:13px;font-weight:500;color:var(--ok)}
.up-list .bad .mark,.up-list .why{color:var(--safranin)}
.up-list .why{font-size:13px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}

/* 頁尾與資料字典 */
.foot{padding-block:24px 48px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2);display:flex;gap:12px 24px;flex-wrap:wrap;justify-content:space-between}
.foot p{margin:0;max-width:40em}
dialog{width:min(1040px,calc(100vw - 32px));max-height:calc(100vh - 48px);border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(20,16,32,.45)}
.dict-head{position:sticky;top:0;z-index:1;background:var(--surface);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line)}
.dict-head h2{font-family:var(--font-display);font-size:20px;margin:0}
.dict-body{padding:0 20px 20px;overflow-x:auto}
.dict-body table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.55}
.dict-body th,.dict-body td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
.dict-body thead th{color:var(--ink-2);font-weight:500;white-space:nowrap}
.dict-sec th{background:var(--violet-tint);color:var(--ink);font-weight:500}
.dict-body code{font-size:12.5px;white-space:nowrap}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);gap:0;padding-top:24px}
  .steps{position:static;margin-bottom:22px}
  .steps ol{grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
  .step-btn{justify-content:center;padding:14px 0;border-radius:6px}
  .step-btn:hover,.step-btn[aria-current="step"]{background:transparent}
  .step-btn .n,.step-btn .t,.steps-meta{display:none}
  .rod{width:100%;height:8px;transform:none}
  .step-btn[aria-current="step"] .rod{height:10px;border-width:2px;border-color:var(--violet)}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:600px){
  .hero{grid-template-columns:1fr;padding-top:28px;gap:10px}
  .hero-fig{order:-1;width:72px}
  .lede{font-size:16px}
  .facts{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}
  .field{grid-column:span 2}
  .field.t-number{grid-column:span 1}
  .step-head h2{font-size:23px}
  .review{padding:16px}
  .btn-primary{padding:11px 20px}
}
</style>
</head>
<body>
<a class="skip" href="#app">跳到表單</a>
<div id="banners" class="wrap"></div>

<header class="hero wrap">
  <div>
    <h1>貓 <i class="genus">Neisseria</i> 心包炎<br>病例登錄</h1>
    <p class="lede">我們正在整理台灣心包液培養出 <i>Neisseria</i> 屬的貓病例，做成多中心回溯性病例系列。每例分 6 步，約 10 分鐘。你的聯絡資料只要填一次；血液檢查和藥敏不用打數字，上傳報告就好。草稿會自動存在這台電腦，可以分次填完。</p>
  </div>
  <figure class="hero-fig" aria-hidden="true">
    <svg viewBox="0 0 240 240">
      <circle cx="120" cy="122" r="90" fill="var(--cell)" stroke="var(--cell-edge)" stroke-width="1.5"/>
      <g fill="var(--nuc)">
        <ellipse cx="88" cy="108" rx="30" ry="23" transform="rotate(-24 88 108)"/>
        <ellipse cx="140" cy="92" rx="27" ry="21" transform="rotate(14 140 92)"/>
        <ellipse cx="148" cy="146" rx="25" ry="20" transform="rotate(-12 148 146)"/>
      </g>
      <g fill="none" stroke="var(--nuc)" stroke-width="7" stroke-linecap="round">
        <path d="M108 100 Q118 94 124 92"/>
        <path d="M152 112 Q156 122 152 128"/>
      </g>
      <g fill="var(--nuc-2)" opacity=".55">
        <ellipse cx="82" cy="104" rx="9" ry="6"/>
        <ellipse cx="97" cy="117" rx="7" ry="5"/>
        <ellipse cx="136" cy="88" rx="8" ry="5"/>
        <ellipse cx="152" cy="150" rx="7" ry="5"/>
      </g>
      <g fill="var(--vac)" opacity=".75">
        <circle cx="70" cy="152" r="5"/>
        <circle cx="96" cy="170" r="4"/>
        <circle cx="181" cy="118" r="4.5"/>
        <circle cx="118" cy="192" r="3.5"/>
        <circle cx="178" cy="172" r="3"/>
      </g>
      <g fill="var(--bact)">
        <rect x="-7" y="-2.6" width="14" height="5.2" rx="2.6" transform="translate(84 178) rotate(28)"/>
        <rect x="-7" y="-2.6" width="14" height="5.2" rx="2.6" transform="translate(101 188) rotate(-14)"/>
        <rect x="-7" y="-2.6" width="14" height="5.2" rx="2.6" transform="translate(188 144) rotate(62)"/>
        <rect x="-7" y="-2.6" width="14" height="5.2" rx="2.6" transform="translate(183 158) rotate(70)"/>
        <rect x="-7" y="-2.6" width="14" height="5.2" rx="2.6" transform="translate(166 188) rotate(12)"/>
        <rect x="-7" y="-2.6" width="14" height="5.2" rx="2.6" transform="translate(64 136) rotate(-40)"/>
        <rect x="-7" y="-2.6" width="14" height="5.2" rx="2.6" transform="translate(117 58) rotate(18)"/>
        <rect x="-7" y="-2.6" width="14" height="5.2" rx="2.6" transform="translate(131 62) rotate(18)"/>
      </g>
      <g fill="var(--bact)" opacity=".85">
        <rect x="-7" y="-2.6" width="14" height="5.2" rx="2.6" transform="translate(214 38) rotate(24)"/>
        <rect x="-7" y="-2.6" width="14" height="5.2" rx="2.6" transform="translate(227 44) rotate(24)"/>
        <rect x="-7" y="-2.6" width="14" height="5.2" rx="2.6" transform="translate(24 214) rotate(-32)"/>
      </g>
    </svg>
  </figure>
  <dl class="facts">
    <div><dt>收案條件</dt><dd>貓，心包液或心包組織培養出 <i>Neisseria</i> 屬，首次採樣在 2015 年以後</dd></div>
    <div><dt>不收集</dt><dd>飼主姓名、電話、地址、病歷號與晶片號</dd></div>
    <div><dt>收案截止</dt><dd id="fact-deadline"></dd></div>
    <div><dt>主持人</dt><dd id="fact-pi"></dd></div>
  </dl>
</header>

<main class="wrap app" id="app" tabindex="-1">
  <nav class="steps" aria-label="填寫步驟">
    <ol id="rail-list"></ol>
    <p class="steps-meta" id="rail-meta"></p>
  </nav>
  <div class="panel">
    <form id="crf" novalidate autocomplete="off">
      <div id="steps-host"></div>

      case 'consent': return byId(f.id).checked;
      case 'files': return (fileStore[f.id] || []).slice();
      case 'drugs': return drugRows(f);
      default: { const i = byId(f.id); const v = i ? i.value.trim() : ''; return f.upper ? v.toUpperCase() : v; }
    }
  }
  function collect() {
    const V = {};
    FIELDS.forEach(({ f }) => {
      V[f.id] = getValue(f);
      if (f.other) V[`${f.id}_other`] = byId(`${f.id}_other`).value.trim();
    });
    return V;
  }
  function setValue(f, v) {
    const w = WRAP.get(f.id);
    switch (f.type) {
      case 'radio': $$(`input[name="${f.id}"]`, w).forEach(i => { i.checked = i.value === v; }); break;
      case 'checks': $$(`input[name="${f.id}"]`, w).forEach(i => { i.checked = Array.isArray(v) && v.includes(i.value); }); break;
      case 'consent': byId(f.id).checked = !!v; break;
      case 'files': fileStore[f.id] = []; drawFiles(f); break;
      case 'drugs': {
        drugStore[f.id] = {};
        (Array.isArray(v) ? v : []).forEach(r => { if (r && r.drug) drugStore[f.id][r.drug] = Object.assign({}, r); });
        const list = byId(`dl-${f.id}`);
        list.dataset.labels = '';
        list.textContent = '';
        break;
      }
      default: { const i = byId(f.id); if (i) i.value = v == null ? '' : v; }
    }
  }
  function applyValues(V) {
    Object.entries(V || {}).forEach(([k, v]) => {
      if (FIELDS.has(k)) { const { f } = FIELDS.get(k); if (f.type !== 'files') setValue(f, v); }
      else if (k.endsWith('_other')) { const i = byId(k); if (i) i.value = v || ''; }
    });
  }
  const contributorValues = V => {
    const o = {};
    FIELDS.forEach(({ f }) => { if (f.keep) o[f.id] = V[f.id]; });
    return o;
  };

  /* ---------- 顯示條件與驗證 ---------- */
  function deps(c) { return (c.any || c.all) ? (c.any || c.all).flatMap(deps) : [c.f]; }
  function test(c, V) {
    if (c.any) return c.any.some(x => test(x, V));
    if (c.all) return c.all.every(x => test(x, V));
    const v = V[c.f];
    if ('eq' in c) return v === c.eq;
    if ('in' in c) return c.in.includes(v);
    if ('has' in c) return Array.isArray(v) && v.includes(c.has);
    if ('nothas' in c) return Array.isArray(v) && v.length > 0 && !v.includes(c.nothas);
    if ('lacks' in c) return !(Array.isArray(v) && v.includes(c.lacks));
    return !isEmpty(v);
  }
  function visible(id, V, depth = 0) {
    const e = FIELDS.get(id);
    if (!e || !e.f.showIf || depth > 8) return true;
    const c = e.f.showIf;
    if (!test(c, V)) return false;
    const ds = deps(c);
    return c.any ? ds.some(d => visible(d, V, depth + 1)) : ds.every(d => visible(d, V, depth + 1));
  }
  function errorFor(f, V) {
    const v = V[f.id];
    if (isEmpty(v)) {
      if (!f.required) return '';
      if (f.type === 'files') return '請上傳至少一個檔案';
      if (f.type === 'consent') return '請確認這一項';
      if (['radio', 'checks', 'select'].includes(f.type)) return '請選擇';
      return '請填寫這一欄';
    }
    if (f.check && codeCache.get(v) === 'bad') return errText('ACCESS_DENIED');
    if (f.type === 'drugs') {
      for (const r of v) {
        if (r.dose && !(/^\d+(\.\d+)?$/.test(r.dose) && Number(r.dose) > 0 && Number(r.dose) <= 1000)) return `${r.drug}：劑量請填數字（mg/kg）`;
        if (r.start && !/^\d{1,3}$/.test(r.start)) return `${r.drug}：第幾天開始請填整數，診斷當天是 0`;
        if (r.days && !/^\d{1,3}$/.test(r.days)) return `${r.drug}：天數請填整數`;
      }
    }
    if (f.type === 'number') {
      if (!/^-?\d+(\.\d+)?$/.test(v)) return '請填數字';
      const n = Number(v);
      if (f.int && !Number.isInteger(n)) return '請填整數';
      if (f.min !== undefined && n < f.min) return `不能小於 ${f.min}`;
      if (f.max !== undefined && n > f.max) return `不能大於 ${f.max}`;
    }
    if (f.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return 'Email 格式不正確';
    if (f.type === 'date') {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return '日期格式不正確';
      if (v > TODAY) return '日期不能晚於今天';
      if (f.min && v < f.min) return `日期不能早於 ${f.min}`;

    if (f.other && f.required && hasOther(f, v) && !V[`${f.id}_other`]) return `請說明「${otherOf(f)}」的內容`;

  function showErr(f, msg) {

  }
  function stepErrors(si, V) {

  }

  /* ---------- 換步驟 ---------- */
  function goTo(i, opts = {}) {
    i = Math.max(0, Math.min(LAST, i));
    cur = i;
    visited.add(i);
    SCHEMA.forEach((sec, k) => { byId(`step-${sec.id}`).hidden = k !== i; });
    byId('crf').hidden = false;
    byId('done').hidden = true;
    refresh();
    if (opts.scroll !== false) byId('app').scrollIntoView({ block: 'start', behavior: reduced() ? 'auto' : 'smooth' });

    schedule();
  }
  async function next() {
    if (busy) return;
    if (cur === LAST) { submit(); return; }
    tried.add(cur);
    let V = collect();
    if (cur === 0 && CONFIG.ENDPOINT && V.access_code && codeCache.get(V.access_code) !== 'ok') {
      setBusy(true, '正在確認邀請碼…');
      await verifyCode(V.access_code);
      setBusy(false);
      V = collect();
    }
    const errs = stepErrors(cur, V);
    showStepErrors(cur, V);
    refresh();
    if (errs.length) { focusField(errs[0].f.id); return; }
    goTo(cur + 1);
  }
  function focusField(id) {
    const e = FIELDS.get(id);
    if (!e) return;
    if (e.si !== cur) goTo(e.si, { scroll: false, focus: false });
    const w = WRAP.get(id);
    if (w.hidden) return;
    w.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'center' });
    const t = $('input:not(.hp), select, textarea', w);
    if (t) setTimeout(() => t.focus({ preventScroll: true }), reduced() ? 0 : 320);
  }
  function setBusy(on, text) {
    busy = on;
    const b = byId('btn-next');
    b.disabled = on;
    if (on && text) b.textContent = text.length > 8 ? '請稍候…' : text;
    status(on ? (text || '') : '');
    if (!on) refresh();
  }
  function status(text) { byId('pager-status').textContent = text || ''; }

  /* ---------- 更新畫面 ---------- */
  let raf = 0, saveTimer = 0;
  function schedule() {
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; refresh(); });
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveDraft, 700);
  }
  function refresh() {
    const V = collect();
    FIELDS.forEach(({ f }) => {

      w.hidden = !vis;

    });
    let total = 0, done = 0;
    const missing = [];
    SCHEMA.forEach((sec, si) => {
      let t = 0, d = 0, any = false, bad = false;
      sec.fields.forEach(f => {
        if (!visible(f.id, V)) return;
        const msg = errorFor(f, V);
        if (!isEmpty(V[f.id])) any = true;
        if (f.required) { t++; if (msg) missing.push(f.id); else d++; }
        if (msg && tried.has(si)) bad = true;
      });
      total += t; done += d;
      const state = bad ? 'error' : t ? (d === t ? 'done' : 'todo') : ((any || (visited.has(si) && si !== cur)) ? 'done' : 'todo');
      const btn = $(`.step-btn[data-i="${si}"]`);

      btn.setAttribute('aria-label', `第 ${si + 1} 步：${sec.title}，${{ error: '有欄位要修正', done: '已完成', todo: '未完成' }[state]}`);

    const who = byId('whoami');
    if (who) {
      const ok = !stepErrors(0, V).length;
      const text = ok ? `登錄者：${V.c_name}（${V.c_hospital}）` : '';
      if (text !== whoText) {
        whoText = text;
        who.hidden = !ok;
        who.textContent = '';
        if (ok) who.append(text, ' ', h('button', { type: 'button', class: 'linkbtn', text: '修改', onclick: () => goTo(0) }));
      }

  }
  function renderReview(V, missing, total) {

    rb.textContent = '';
    if (missing.length) rb.append(h('p', { text: `還有 ${missing.length} 個必填沒填：` }), h('ul', { class: 'review-list miss' }, missing.map(link)));
    else rb.append(h('p', { class: 'review-ok', text: `必填 ${total} 項都完成了，可以送出。` }));
    const sugg = SUGGEST.filter(id => visible(id, V) && isEmpty(V[id]));
    if (sugg.length) rb.append(h('p', { text: '這些選填資料對分析很有幫助，手邊有的話請補上：' }), h('ul', { class: 'review-list' }, sugg.map(link)));
  }

  /* ---------- 事件 ---------- */
  function onChange(e) {
    const t = e.target;

      const { f } = FIELDS.get(t.name);
      if (f.exclusive && t.checked) {
        const ex = f.exclusive.includes(t.value);
        $$(`input[name="${f.id}"]`, WRAP.get(f.id)).forEach(o => { if (o !== t && (ex || f.exclusive.includes(o.value))) o.checked = false; });
      }
    }
    if (t.id === 'access_code' && e.type === 'input') { const st = byId('code-status'); st.textContent = ''; st.className = 'code-status'; }
    const w = t.closest('.field');
    if (w && t.type !== 'file') {
      const { f, si } = FIELDS.get(w.dataset.id);
      const V = collect();
      if (tried.has(si)) showStepErrors(si, V);
      else if (w.classList.contains('invalid')) showErr(f, visible(f.id, V) ? errorFor(f, V) : '');

  }

  /* ---------- 與後端溝通 ---------- */
  async function api(body) {
    const res = await fetch(CONFIG.ENDPOINT, { method: 'POST', body: JSON.stringify(body), redirect: 'follow' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }
  function errText(code) {
    return ({
      ACCESS_DENIED: '邀請碼不正確，請對照邀請訊息再輸入一次。',
      NOT_CONFIGURED: '收案系統還沒啟用，請聯絡主持人。',
      FILE_TOO_LARGE: `檔案超過 ${CONFIG.MAX_FILE_MB} MB。`,
      UPLOAD_EXPIRED: '上傳中斷太久，請按「重試失敗的附件」。',
      UNKNOWN_ACTION: '收案系統正在更新，請稍後按「重試失敗的附件」。',
      TYPE_NOT_ALLOWED: '只接受圖片、PDF 或影片檔。',
      CASE_NOT_FOUND: '找不到這個病例編號，請聯絡主持人。',
      BAD_CASE_ID: '病例編號格式錯誤，請聯絡主持人。',
      BAD_JSON: '資料格式錯誤，請重新整理頁面後再試一次。',
      SERVER_ERROR: '收案系統發生錯誤，請稍後再試；一直失敗的話請聯絡主持人。',
      NETWORK: '網路連線失敗。'

  }
  async function verifyCode(code) {
    const st = byId('code-status');
    if (!CONFIG.ENDPOINT || !code) return 'unknown';
    if (codeCache.has(code)) return codeCache.get(code);
    st.className = 'code-status';
    st.textContent = '正在確認邀請碼…';
    try {
      const r = await api({ action: 'check', accessCode: code });
      const res = r && r.ok ? 'ok' : (r && r.error === 'ACCESS_DENIED') ? 'bad' : 'unknown';
      if (res !== 'unknown') codeCache.set(code, res);
      st.className = res === 'ok' ? 'code-status ok' : 'code-status';
      st.textContent = res === 'ok' ? '邀請碼正確' : res === 'bad' ? '' : errText(r && r.error);
      return res;
    } catch (e) {
      st.className = 'code-status';

    }
  }
  function buildPayload(V) {
    const p = { action: 'submit', accessCode: V.access_code, website: byId('website').value, contributor: {}, case: { site_city: V.c_city, form_version: CONFIG.FORM_VERSION } };
    SCHEMA.forEach(sec => sec.fields.forEach(f => {
      if (f.meta) return;
      const vis = visible(f.id, V);
      if (f.type === 'files') { p.case[`${f.id}_n`] = vis ? V[f.id].length : 0; return; }
      if (f.type === 'drugs') { p.case[f.id] = vis ? drugText(V[f.id]) : ''; return; }
      const target = (f.group || sec.group) === 'contributor' ? p.contributor : p.case;
      let val = vis ? V[f.id] : '';
      if (Array.isArray(val)) val = val.join('; ');
      if (typeof val === 'boolean') val = val ? '是' : '否';
      target[f.id] = val;
      if (f.other) target[`${f.id}_other`] = (vis && hasOther(f, V[f.id])) ? V[`${f.id}_other`] : '';
    }));

  }
  function setMsg(content, bad) {
    const m = byId('submit-msg');
    m.textContent = '';
    m.className = `submit-msg${bad ? ' bad' : ''}`;
    if (content) m.append(content);
    m.hidden = !content;
  }

  async function submit() {
    if (busy) return;
    const V = collect();
    const errs = [];
    SCHEMA.forEach((s, si) => { tried.add(si); errs.push(...stepErrors(si, V)); showStepErrors(si, V); });
    refresh();
    if (errs.length) { focusField(errs[0].f.id); return; }
    const payload = buildPayload(V);
    if (!CONFIG.ENDPOINT) {
      const shown = Object.assign({}, payload, { accessCode: payload.accessCode ? '（已填）' : '' });
      const frag = document.createDocumentFragment();
      frag.append(h('p', { text: '預覽模式：還沒設定收案後端，資料沒有送出。下面是實際會送出的內容，附件會在送出後另外上傳。' }), h('pre', { class: 'preview', text: JSON.stringify(shown, null, 2) }));
      setMsg(frag, false);
      return;
    }
    await send(payload, V);
  }

  async function send(payload, V) {
    setMsg('');
    setBusy(true, '正在送出病例資料…');
    let res;
    try { res = await api(payload); }
    catch (err) {
      setBusy(false);
      setMsg('網路連線失敗，資料沒有送出。表單內容還在，請稍後再按一次「送出病例」。', true);
      return;
    }
    if (!res || !res.ok) {
      setBusy(false);
      const msg = errText(res && res.error);
      if (res && res.error === 'ACCESS_DENIED') {
        codeCache.set(payload.accessCode, 'bad');
        tried.add(0);
        showErr(FIELDS.get('access_code').f, msg);
        refresh();
        focusField('access_code');

    }
    lastCase = res.caseId;
    lastCode = payload.accessCode;
    codeCache.set(lastCode, 'ok');
    lastJobs = [];
    SCHEMA.forEach(sec => sec.fields.forEach(f => {
      if (f.type === 'files' && visible(f.id, V)) (fileStore[f.id] || []).forEach(file => lastJobs.push({ label: labelText(f), category: f.id, file, ok: false, err: '' }));
    }));
    await runUploads(t => status(t));
    store.set(CONTRIB_KEY, contributorValues(V));
    store.del(DRAFT_KEY);
    setBusy(false);
    showDone();
  }
  async function runUploads(onProgress) {
    const todo = lastJobs.filter(j => !j.ok);
    for (let i = 0; i < todo.length; i++) {
      const j = todo[i];
      const label = `正在上傳附件 ${i + 1}／${todo.length}：${j.file.name}`;
      if (onProgress) onProgress(label);
      try {
        const r = await uploadOne(j, pct => { if (onProgress) onProgress(`${label}（${pct}%，請先不要關閉頁面）`); });
        j.ok = !!(r && r.ok);
        j.err = j.ok ? '' : errText(r && r.error);
      } catch (e) { j.ok = false; j.err = errText('NETWORK'); }
    }
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));

      catch (e) { if (k >= tries) throw e; await sleep(2000 * k); }
    }
  }
  /* 4 MB 以下一次傳完；更大的檔案分段傳，後端再轉存到雲端硬碟，不限大小 */
  async function uploadOne(j, onPct) {
    const file = j.file, chunk = CONFIG.CHUNK_MB * 1048576;
    const meta = { accessCode: lastCode, caseId: lastCase, category: j.category, fileName: file.name, mimeType: mimeOf(file) };
    const whole = async () => api(Object.assign({ action: 'upload', data: await toBase64(file) }, meta));
    if (file.size <= chunk || !chunked) return whole();
    let restarted = false;
    for (;;) {
      const st = await retry(() => api(Object.assign({ action: 'upload_start', size: file.size }, meta)));
      if (st && st.error === 'UNKNOWN_ACTION' && file.size <= CONFIG.MAX_FILE_MB * 1048576) return whole();
      if (!st || !st.ok) return st;
      let offset = 0;
      for (;;) {
        const data = await toBase64(file.slice(offset, Math.min(offset + chunk, file.size)));
        const r = await retry(() => api({ action: 'upload_chunk', accessCode: lastCode, token: st.token, offset, data }));
        if (r && r.error === 'BUSY') { await sleep(3000); continue; }
        if (r && r.error === 'UPLOAD_EXPIRED' && !restarted) { restarted = true; break; }
        if (!r || !r.ok || r.done) return r;
        offset = r.next;
        onPct(Math.floor(offset / file.size * 100));
      }
    }
  }

  function showDone() {
    const done = byId('done');
    const failed = lastJobs.filter(j => !j.ok);
    done.textContent = '';
    done.append(
      h('h2', { class: 'done-title', id: 'done-title', tabindex: '-1', text: '病例已登錄' }),
      h('p', { class: 'case-id', id: 'case-id', text: lastCase }),
      h('p', { text: '請把這個病例編號記在院內病歷。主持人詢問缺漏資料時會用它；病例編號和病歷號的對照也請院內自行保存。' })
    );
    if (lastJobs.length) {
      done.append(h('h3', { text: `附件 ${lastJobs.length - failed.length}／${lastJobs.length} 已上傳` }), h('ul', { class: 'up-list' }, lastJobs.map(j => h('li', { class: j.ok ? 'ok' : 'bad' }, h('span', { class: 'mark', text: j.ok ? '已上傳' : '失敗' }), h('span', { class: 'fname', text: `${j.label}：${j.file.name}` }), j.ok ? null : h('span', { class: 'why', text: j.err })))));
    }
    const copyBtn = h('button', { type: 'button', class: 'btn-secondary', text: '複製病例編號' });
    copyBtn.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(lastCase); copyBtn.textContent = '已複製'; }
      catch (e) { const r = document.createRange(); r.selectNodeContents(byId('case-id')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); copyBtn.textContent = '已選取，請按複製'; }
    });
    const acts = h('div', { class: 'actions' }, copyBtn);
    if (failed.length) acts.append(h('button', { type: 'button', class: 'btn-secondary', text: '重試失敗的附件', onclick: async ev => { ev.target.disabled = true; ev.target.textContent = '正在重試…'; await runUploads(null); showDone(); } }));
    acts.append(h('button', { type: 'button', class: 'btn-primary', text: '登錄下一例', onclick: nextCase }));
    done.append(acts, h('p', { class: 'help', text: failed.length ? '失敗的附件可以重試；一直失敗的話，請直接寄給主持人並註明病例編號。' : '「登錄下一例」會保留你的資料，從基本資料開始填。' }));
    byId('crf').hidden = true;
    done.hidden = false;
    $$('.step-btn').forEach(b => b.removeAttribute('aria-current'));
    $$('.rod').forEach(r => { r.dataset.state = 'done'; });
    byId('rail-meta').textContent = '';
    byId('app').scrollIntoView({ block: 'start', behavior: reduced() ? 'auto' : 'smooth' });
    byId('done-title').focus({ preventScroll: true });
  }
  function nextCase() {
    const keep = contributorValues(collect());
    FIELDS.forEach(({ f }) => {
      if (f.keep) return;
      setValue(f, f.type === 'checks' ? [] : f.type === 'consent' ? false : '');
      if (f.other) byId(`${f.id}_other`).value = '';
    });
    FIELDS.forEach(({ f }) => showErr(f, ''));
    applyValues(keep);
    tried.clear();
    visited.clear();
    lastJobs = []; lastCase = '';
    setMsg('');
    goTo(1);
  }

  /* ---------- 草稿 ---------- */
  function saveDraft() {
    if (!byId('done').hidden || busy) return;
    const V = collect();
    const meaningful = SCHEMA.some(sec => sec.group === 'case' && sec.fields.some(f => f.type !== 'files' && !isEmpty(V[f.id])));
    if (!meaningful) return;
    const data = {};
    Object.entries(V).forEach(([k, v]) => { if (!(FIELDS.has(k) && FIELDS.get(k).f.type === 'files')) data[k] = v; });
    if (store.set(DRAFT_KEY, { t: Date.now(), v: data, step: cur })) status(`已存草稿 ${hhmm(new Date())}`);
  }
  function banner(kind, text, actions) {
    const b = h('div', { class: `banner ${kind}`, id: `banner-${kind}`, role: 'status' }, h('span', { class: 'banner-text', html: text }));
    (actions || []).forEach(([label, fn]) => b.append(h('button', { type: 'button', class: 'banner-btn', text: label, onclick: fn })));
    byId('banners').append(b);
  }
  const closeBanner = kind => { const b = byId(`banner-${kind}`); if (b) b.remove(); };

  /* ---------- 資料字典 ---------- */
  const DICT_COLS = [['sec', '段落'], ['id', '變項代碼'], ['label', '欄位'], ['type', '類型'], ['options', '選項或單位'], ['required', '必填'], ['cond', '顯示條件']];
  function openDict() {
    const body = byId('dict-body');
    if (!body.dataset.built) {
      const cols = DICT_COLS.filter(([k]) => k !== 'sec');
      const tbody = h('tbody');
      let sec = '';
      dictRows().forEach(r => {
        if (r.sec !== sec) { sec = r.sec; tbody.append(h('tr', { class: 'dict-sec' }, h('th', { colspan: String(cols.length), scope: 'colgroup', text: sec }))); }
        tbody.append(h('tr', {}, cols.map(([k]) => h('td', {}, k === 'id' ? h('code', { text: r.id }) : r[k]))));
      });
      body.append(h('table', {}, h('thead', {}, h('tr', {}, cols.map(([, t]) => h('th', { scope: 'col', text: t })))), tbody));
      body.dataset.built = '1';
    }
    const dlg = byId('dict');
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
  }
  function downloadDict() {
    const esc = s => `"${String(s == null ? '' : s).replace(/"/g, '""')}"`;
    const lines = [DICT_COLS.map(([, t]) => esc(t)).join(','), ...dictRows().map(r => DICT_COLS.map(([k]) => esc(r[k])).join(','))];
    const url = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
    const a = h('a', { href: url, download: 'neisseria-crf-data-dictionary.csv' });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  }

  /* ---------- 啟動 ---------- */
  function boot() {
    render();
    const [y, m, d] = CONFIG.DEADLINE.split('-').map(Number);
    byId('fact-deadline').textContent = `${y} 年 ${m} 月 ${d} 日`;
    byId('fact-pi').textContent = `${CONFIG.PI}，${CONFIG.HOSPITAL}`;
    byId('form-version').textContent = CONFIG.FORM_VERSION;

    const form = byId('crf');
    form.addEventListener('input', onChange);
    form.addEventListener('change', onChange);
    form.addEventListener('focusout', onBlur);
    form.addEventListener('submit', e => e.preventDefault());
    form.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox' && e.target.type !== 'radio') e.preventDefault(); });
    byId('btn-prev').addEventListener('click', () => { if (!busy) goTo(cur - 1); });
    byId('btn-next').addEventListener('click', next);
    byId('btn-dict').addEventListener('click', openDict);
    byId('dict-close').addEventListener('click', () => { const dlg = byId('dict'); if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); });
    byId('dict-csv').addEventListener('click', downloadDict);

    if (!CONFIG.ENDPOINT) banner('demo', '預覽模式：還沒設定收案後端，送出時只會顯示將送出的資料，不會儲存。');
    else fetch(CONFIG.ENDPOINT, { redirect: 'follow' }).then(r => r.json()).then(r => { chunked = !!(r && r.chunked); }).catch(() => {});
    window.addEventListener('beforeunload', e => { if (busy) { e.preventDefault(); e.returnValue = ''; } });
    let start = 0;
    const c = store.get(CONTRIB_KEY);
    if (c) { applyValues(c); if (!stepErrors(0, collect()).length) start = 1; }
    const draft = store.get(DRAFT_KEY);
    if (draft && draft.v) {
      const t = new Date(draft.t);
      banner('draft', `這台電腦上有一份還沒送出的草稿（${t.getMonth() + 1}/${t.getDate()} ${hhmm(t)}）。`, [
        ['恢復草稿', () => { applyValues(draft.v); closeBanner('draft'); goTo(Math.min(LAST, draft.step || 0)); }],
        ['捨棄', () => { store.del(DRAFT_KEY); closeBanner('draft'); }]
      ]);
    }
    goTo(start, { scroll: false, focus: false });
    if (location.hash === '#dictionary') openDict();
  }
  boot();
})();
</script>
</body>
</html>
